name: CI

# The budget is 30 minutes on this 4-core runner. Turnaround is the point:
# a human waits on it, and an AI agent working on this repository is
# limited by it far more, because what an agent gets done is the number
# of decisions it can make per hour, and each one waits on a result.
# Tests too expensive for that are in //test:local, run by hand.

on:
  workflow_dispatch:
  push:
    branches: [main]
  # `closed` too: the closing event's run joins the pull request's
  # concurrency group, cancels the run still going (hours, when cold)
  # and runs no job itself.
  pull_request:
    types: [opened, synchronize, reopened, closed]

# A superseded pull request run is cancelled. A main run is not: it is
# the only run that saves the disk cache, and a push to main cancelling
# the one before it left every later run cold.
#
# A pull request's group is its number, not github.ref: the run for a
# merged pull request's `closed` event has github.ref refs/heads/main, and
# keyed on that it joined main's group and cancelled main's run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    if: github.event.action != 'closed'
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      # The disk cache saved from main is pruned to this, under the
      # repository's 10 GB of Actions cache.
      DISK_CACHE_CAP_GB: 8
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          docker-images: true
          large-packages: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          cache-save: ${{ github.ref == 'refs/heads/main' }}
          bazelisk-cache: true
          external-cache: |
            manifest:
              openroad+:
                - MODULE.bazel
                - .github/openroad-cache-version

      # No repository cache: it had grown to 6.9 GB, took as long to
      # restore as downloading the archives does, and its two copies
      # evicted the disk cache, the one that saves hours.
      - name: Disk cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            bazel-disk-v2-${{ runner.os }}-

      # Bazel's idle garbage collection (.bazelrc caps the disk cache at
      # 2G for workstations) deleted files while the save step tarred
      # them, and the save failed. CI prunes the cache itself before
      # saving, with Bazel stopped.
      - name: Configure caches
        run: |
          echo "common --disk_cache=$HOME/.cache/bazel-disk" >> ~/.bazelrc
          echo "build --experimental_disk_cache_gc_max_size=0" >> ~/.bazelrc
          echo "common --show_progress_rate_limit=60" >> ~/.bazelrc
          echo "test --test_summary=terse" >> ~/.bazelrc
          echo "common --repo_env=DO_NOT_TRACK=1" >> ~/.bazelrc
          # What the restore brought: the working set below is what is
          # newer than the marker, and an unchanged file count means
          # the run added nothing to save.
          mkdir -p ~/.cache/bazel-disk
          touch ~/.cache/bazel-disk.restored
          find ~/.cache/bazel-disk -type f | wc -l > ~/.cache/bazel-disk.files

      # Isolate the one-time Bazel module-graph resolution so the Lint step
      # below reflects actual lint work, not first-invocation setup.
      - name: Warm up Bazel
        run: bazelisk mod graph >/dev/null

      # --- Lint ---
      - name: Lint
        run: |
          bazelisk run //:fix_lint
          git diff --exit-code

      # MODULE.bazel's dev/non-dev split against what ships: see
      # public_surface.py for the three rules it enforces.
      - name: Public surface
        run: bazelisk run //:public_surface

      # What a consumer must already have installed: see host_tools.py for
      # the denied tools and the host-python version floor.
      - name: Host tools
        run: bazelisk run //:host_tools

      # --- @orfs design packages ---
      #
      # Loading every design package catches API skew between this repo and
      # the ORFS it pins. Two such skews had accumulated unnoticed -- ORFS
      # passing a `blender` argument after it was removed here, and
      # user_stages reaching orfs_update -- because nothing built @orfs
      # designs from this workspace.
      #
      # query, not `build --nobuild`: this guards LOADING, and analysis
      # drags in unrelated pre-existing breakage (ORFS's gcd_single_flow_*
      # tests reference @openroad, which is not visible from @orfs when
      # @orfs is a non-root dependency). Loading every package is the part
      # that catches DSL and rule-signature skew, and it costs seconds --
      # 3889 targets across every platform.
      - name: Load @orfs design packages
        run: bazelisk query '@orfs//flow/designs/...:*' > /dev/null

      # Loading a package does not resolve the labels its rules reference.
      # asap7/coralnpu loaded fine while its synth target pointed at
      # //flow/designs/src/coralnpu, a directory ORFS had added with no
      # BUILD; only analysis sees that edge. So analyse the flow targets
      # themselves -- every design's _route, which pulls in synth through
      # grt -- with --nobuild. Filtering to _route keeps out the bespoke
      # ORFS targets (gcd_single_flow_*) that reference @openroad, which
      # is why the step above is a query. ~1 minute for every platform.
      - name: Analyse @orfs design flow targets
        run: >
          bazelisk build --nobuild --keep_going
          $(bazelisk query 'filter("_route$", kind(rule, @orfs//flow/designs/...))')

      # What the tests build is checked by hand, not here:
      # `bazelisk run //local:check-ci-clean` (local/check_ci_clean.py).
      # --- Unit tests ---
      - name: Run tests
        run: bazelisk test ... --build_tests_only --test_output=errors --profile=test.profile

      # Where the time went: the critical path, the time per mnemonic and
      # the slowest actions, in the log and the job summary, and the
      # profile itself for a closer look (chrome://tracing, or
      # `bazelisk analyze-profile`).
      - name: Slowest actions
        if: always() && hashFiles('test.profile') != ''
        run: |
          bazelisk run //test/ci:slowest_actions -- "$PWD/test.profile" 30 | tee slowest_actions.txt
          { echo '```'; cat slowest_actions.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # What this run read or wrote in the disk cache: Bazel touches an
      # entry on every hit, so everything newer than the restore. Above
      # the cap, the prune below drops entries the next run needs, the
      # compile outputs first since a cold build writes them first, and
      # main stays cold run after run: fail, on a pull request too,
      # before it merges. Above 80%, warn while there is room.
      - name: Disk cache working set
        if: always()
        run: |
          used=$(find ~/.cache/bazel-disk -type f -newer ~/.cache/bazel-disk.restored -printf '%s\n' \
            | awk '{ total += $1 } END { print total + 0 }')
          cap=$((DISK_CACHE_CAP_GB * 1024 * 1024 * 1024))
          pct=$((used * 100 / cap))
          msg="Disk cache working set: $((used / 1024 / 1024)) MiB, ${pct}% of the ${DISK_CACHE_CAP_GB} GB cap"
          echo "$msg" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$pct" -ge 100 ]; then echo "::error::$msg"; exit 1; fi
          if [ "$pct" -ge 80 ]; then echo "::warning::$msg"; fi

      - name: Upload profile
        if: always() && hashFiles('test.profile') != ''
        uses: actions/upload-artifact@v7
        with:
          name: test-profile
          path: |
            test.profile
            slowest_actions.txt
          if-no-files-found: ignore

      # --- Save the disk cache (main branch only) ---
      #
      # Stop Bazel so nothing writes the cache while it is saved, then
      # delete the least recently used entries (Bazel touches an entry on
      # every hit) until it fits in DISK_CACHE_CAP_GB. A run that added
      # nothing saves nothing: the cache it restored already holds all
      # of it, and saving 5 GB again only churns the Actions cache.
      - name: Prune disk cache
        id: prune
        if: always() && github.ref == 'refs/heads/main'
        run: |
          bazelisk shutdown
          if [ "$(find ~/.cache/bazel-disk -type f | wc -l)" = "$(cat ~/.cache/bazel-disk.files)" ]; then
            echo "Nothing added to the disk cache since the restore; not saving it"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          du -sh ~/.cache/bazel-disk
          find ~/.cache/bazel-disk -type f -printf '%T@ %s %p\n' \
            | sort -rn \
            | awk -v cap=$((DISK_CACHE_CAP_GB * 1024 * 1024 * 1024)) '{ total += $2; if (total > cap) print $3 }' \
            | xargs -r rm -f
          du -sh ~/.cache/bazel-disk

      - name: Save disk cache
        if: always() && steps.prune.outputs.changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-v2-${{ runner.os }}-${{ github.sha }}
