# Downloads from hosts that have failed a fetch try a mirror first; every
# download is verified against the hash its module or archive pins, so a
# mirror can serve the file but never change it, and the original URL
# stays the fallback (a matching rewrite would otherwise replace it). As
# OpenROAD's bazel/downloader.cfg, which Bazel does not read when OpenROAD
# is a dependency: only the root module's downloader config applies.
#
# Bazel matches a rewrite pattern against the whole URL without its
# scheme, so the patterns need neither ^ nor https://, and the
# replacements name no scheme either.

# SourceForge (tcl_lang): the BCR's Cloudflare mirror.
rewrite downloads\.sourceforge\.net/(.*) bcr.cloudflaremirrors.com/downloads.sourceforge.net/$1
rewrite downloads\.sourceforge\.net/(.*) downloads.sourceforge.net/$1

# bliss (under scip, under OpenROAD) on users.aalto.fi: the BCR's
# Cloudflare mirror holds it; CI failed fetching it on 2026-11-04.
rewrite users\.aalto\.fi/(.*) bcr.cloudflaremirrors.com/users.aalto.fi/$1
rewrite users\.aalto\.fi/(.*) users.aalto.fi/$1

# GNU (m4, through rules_m4): GNU's redirector to a nearby mirror, the
# original, then a German mirror as the last resort.
rewrite mirrors\.kernel\.org/gnu/(.*) ftpmirror.gnu.org/gnu/$1
rewrite mirrors\.kernel\.org/gnu/(.*) mirrors.kernel.org/gnu/$1
rewrite mirrors\.kernel\.org/gnu/(.*) ftp.fau.de/gnu/$1
rewrite ftp\.gnu\.org/gnu/(.*) ftpmirror.gnu.org/gnu/$1
rewrite ftp\.gnu\.org/gnu/(.*) ftp.gnu.org/gnu/$1
rewrite ftp\.gnu\.org/gnu/(.*) ftp.fau.de/gnu/$1
